AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Customer Service Data Analyst Agent - Serverless API

Globals:
  Function:
    Timeout: 120
    MemorySize: 512
    Runtime: python3.11
    Environment:
      Variables:
        NEBIUS_API_KEY: !Ref NebiusApiKey
        CONVERSATIONS_TABLE: !Ref ConversationsTable
        PROFILES_TABLE: !Ref ProfilesTable
        DEPLOYMENT_MODE: aws_lambda

Parameters:
  NebiusApiKey:
    Type: String
    NoEcho: true
    Description: Nebius AI Studio API key

Resources:
  # DynamoDB table for conversation checkpoints
  ConversationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-conversations"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: checkpoint_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
        - AttributeName: checkpoint_id
          KeyType: RANGE

  # DynamoDB table for user profiles
  ProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-profiles"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  # Lambda function
  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: aws_lambda/handler.lambda_handler
      Layers:
        - !Ref DependenciesLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProfilesTable
      Events:
        Chat:
          Type: Api
          Properties:
            Path: /chat
            Method: post
        Health:
          Type: Api
          Properties:
            Path: /health
            Method: get

  # Lambda Layer with dependencies
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-deps"
      ContentUri: aws_lambda/layer/
      CompatibleRuntimes:
        - python3.11
    Metadata:
      BuildMethod: python3.11

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  AgentFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt AgentFunction.Arn
