AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Customer Service Data Analyst Agent — Full serverless stack.
  S3 + CloudFront + API Gateway + Lambda + DynamoDB + Route53 + ACM + CloudWatch

# ──────────────────────────────────────────────
# Parameters
# ──────────────────────────────────────────────
Parameters:
  NebiusApiKey:
    Type: String
    NoEcho: true
    Description: Nebius AI Studio API key

  DomainName:
    Type: String
    Default: CS-Agent.demo.Rotem.click
    Description: Custom domain for the app

  HostedZoneId:
    Type: String
    Description: Route 53 Hosted Zone ID for the domain

  CertificateArn:
    Type: String
    Description: ACM certificate ARN (must be in us-east-1 for CloudFront)

Globals:
  Function:
    Timeout: 120
    MemorySize: 1024
    Runtime: python3.11
    Architectures:
      - x86_64
    Environment:
      Variables:
        NEBIUS_API_KEY: !Ref NebiusApiKey
        CONVERSATIONS_TABLE: !Ref ConversationsTable
        PROFILES_TABLE: !Ref ProfilesTable
        DEPLOYMENT_MODE: aws_lambda
        POWERTOOLS_SERVICE_NAME: cs-agent
        LOG_LEVEL: INFO

# ──────────────────────────────────────────────
# Resources
# ──────────────────────────────────────────────
Resources:

  # ──── DynamoDB ────
  ConversationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-conversations"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: checkpoint_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
        - AttributeName: checkpoint_id
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: cs-agent

  ProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-profiles"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: cs-agent

  # ──── Lambda Function ────
  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-agent"
      CodeUri: .
      Handler: aws_lambda.handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProfilesTable
      Events:
        ChatPost:
          Type: Api
          Properties:
            RestApiId: !Ref AgentApi
            Path: /chat
            Method: POST
        ChatOptions:
          Type: Api
          Properties:
            RestApiId: !Ref AgentApi
            Path: /chat
            Method: OPTIONS
        HealthGet:
          Type: Api
          Properties:
            RestApiId: !Ref AgentApi
            Path: /health
            Method: GET
      Tags:
        Project: cs-agent

  # ──── API Gateway ────
  AgentApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !Sub "'https://${DomainName}'"

  # ──── S3 Bucket (Frontend) ────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-frontend"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: cs-agent

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # ──── CloudFront Function (strip /api prefix) ────
  ApiRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-api-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Strip /api prefix before forwarding to API Gateway
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          request.uri = request.uri.replace(/^\/api/, '');
          if (request.uri === '') request.uri = '/';
          return request;
        }

  # ──── CloudFront ────
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "CS Agent - ${DomainName}"
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100

        Origins:
          # S3 origin (frontend)
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ""

          # API Gateway origin (backend)
          - Id: ApiOrigin
            DomainName: !Sub "${AgentApi}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: /prod
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          Compress: true

        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ApiRewriteFunction.FunctionARN

        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

      Tags:
        - Key: Project
          Value: cs-agent

  # ──── Route 53 DNS ────
  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront global hosted zone ID
        DNSName: !GetAtt CloudFrontDistribution.DomainName

  # ──── CloudWatch Dashboard ────
  AgentDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-dashboard"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Invocations & Errors",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${AgentFunction}", {"stat": "Sum"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${AgentFunction}", {"stat": "Sum", "color": "#d62728"}]
                ],
                "period": 300,
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Duration (ms)",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${AgentFunction}", {"stat": "Average"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${AgentFunction}", {"stat": "p99", "color": "#ff7f0e"}]
                ],
                "period": 300,
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "API Gateway Requests",
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiName", "${AWS::StackName}-api", {"stat": "Sum"}],
                  ["AWS/ApiGateway", "5XXError", "ApiName", "${AWS::StackName}-api", {"stat": "Sum", "color": "#d62728"}],
                  ["AWS/ApiGateway", "4XXError", "ApiName", "${AWS::StackName}-api", {"stat": "Sum", "color": "#ff7f0e"}]
                ],
                "period": 300,
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB Read/Write",
                "metrics": [
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${AWS::StackName}-conversations", {"stat": "Sum"}],
                  ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${AWS::StackName}-conversations", {"stat": "Sum"}],
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${AWS::StackName}-profiles", {"stat": "Sum", "color": "#2ca02c"}],
                  ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${AWS::StackName}-profiles", {"stat": "Sum", "color": "#9467bd"}]
                ],
                "period": 300,
                "region": "${AWS::Region}"
              }
            }
          ]
        }

  # ──── CloudWatch Alarm ────
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-lambda-errors"
      AlarmDescription: Triggers when Lambda errors exceed 5 in 5 minutes
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref AgentFunction

# ──────────────────────────────────────────────
# Outputs
# ──────────────────────────────────────────────
Outputs:
  WebsiteUrl:
    Description: Live site URL
    Value: !Sub "https://${DomainName}"

  ApiUrl:
    Description: API Gateway endpoint
    Value: !Sub "https://${AgentApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"

  CloudFrontDomain:
    Description: CloudFront distribution domain
    Value: !GetAtt CloudFrontDistribution.DomainName

  FrontendBucketName:
    Description: S3 bucket for frontend files
    Value: !Ref FrontendBucket

  DashboardUrl:
    Description: CloudWatch dashboard
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}-dashboard"
